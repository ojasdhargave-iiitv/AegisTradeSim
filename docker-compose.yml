services:
  aegistradesim:
    build: .
    env_file:
      - .env
    volumes:
      - aegistradesim_data:/home/appuser/.aegistradesim
    tty: true
    stdin_open: true

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama

  aegistradesim-ollama:
    build: .
    env_file:
      - .env
    environment:
      - AEGISTRADESIM_LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434/v1
    volumes:
      - aegistradesim_data:/home/appuser/.aegistradesim
    depends_on:
      - ollama
    tty: true
    stdin_open: true
    profiles:
      - ollama

volumes:
  aegistradesim_data:
  ollama_data:
